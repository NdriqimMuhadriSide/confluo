[project]
name = "confluo-api"
version = "0.1.0"
description = "Confluo HTTP API (FastAPI)"
requires-python = ">=3.13"
dependencies = [
  "confluo-core",
  "confluo-crm",
  "uvicorn[standard]>=0.34",
]

[project.scripts]
confluo-api = "confluo_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
