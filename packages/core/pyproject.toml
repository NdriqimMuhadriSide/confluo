[project]
name = "confluo-core"
version = "0.1.0"
description = "Confluo core: tenancy, auth, module registry, events, audit, LLM, jobs"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115",
  "pydantic[email]>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary,pool]>=3.2",
  "pyjwt[crypto]>=2.10",
  "alembic>=1.14",
  "sqlalchemy>=2.0",
  "procrastinate>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
