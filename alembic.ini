# Alembic config. Migrations run as the database owner (CONFLUO_MIGRATIONS_DATABASE_URL);
# the API and worker connect as the non-owner role `confluo_app` so RLS applies to them.
[alembic]
script_location = %(here)s/migrations
# One version directory per package that owns tables; modules add theirs as branches.
version_locations = %(here)s/packages/core/src/confluo_core/migrations %(here)s/modules/crm/src/confluo_crm/migrations
path_separator = space

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
